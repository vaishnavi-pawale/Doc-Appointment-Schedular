# Application Configuration
spring.application.name=doctor-appointment-scheduler

# MySQL Configuration
spring.datasource.url=${DB_URL}
#spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:doctor_appointment_db}?createDatabaseIfNotExist=${DB_CREATE_IF_NOT_EXIST:true}&useSSL=${DB_USE_SSL:false}&serverTimezone=${DB_SERVER_TIMEZONE:UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:com.mysql.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=YourSuperSecretKeyForJWTMustBeAtLeast32BytesLong!
app.jwt.expiration-ms=86400000

# Server Port
server.port=${PORT:8080}

# Email Configuration (Update with your SMTP details)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload Size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
